name: Build RustDesk Windows x64 (Flutter) with custom server ID & key

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Defaults, used only if the repo secrets below are not set.
  DEFAULT_RENDEZVOUS_SERVER: example.yourdomain.tld
  DEFAULT_RS_PUB_KEY: "REPLACE_WITH_BASE64_PUBLIC_KEY"
  DEFAULT_RELAY_SERVER: ""
  # Pinned to match RustDesk's own official Windows build (rustdesk/rustdesk
  # .github/workflows/flutter-build.yml + bridge.yml) as closely as possible —
  # this is not an arbitrary "latest" choice, the real build only works with
  # these exact versions.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  RUST_VERSION: "1.75"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  build-windows-x64:
    # Pinned to match RustDesk's own official CI exactly (not windows-latest) —
    # their build's CMake/vcpkg tooling expects the Visual Studio version that
    # ships on this specific runner image, and windows-latest has since moved
    # on to a newer VS that some of their build steps can't target.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout (submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Bridge-codegen and the actual RustDesk build need two DIFFERENT Rust
      # versions: flutter_rust_bridge_codegen's own dependency tree has moved on
      # to needing a modern Cargo (edition2024), while the pinned 1.75 below is
      # what RustDesk's own Windows build is validated against. Building the
      # codegen tool with 1.75 fails outright, so it gets a separate, newer
      # toolchain here, then the pinned one is installed afterward for the
      # actual build.
      - name: Install Rust toolchain (stable, for bridge codegen tool)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # Bridge codegen's Dart-side step (ffigen) needs the Flutter project's own
      # dependencies already fetched, or it fails looking for
      # .dart_tool/package_config.json.
      - name: Flutter pub get
        working-directory: ./flutter
        run: |
          flutter pub get

      # RustDesk's real CI generates this in a separate Linux job and passes it
      # via artifact download; we don't have that separate job, so we generate
      # the Flutter<->Rust FFI bridge code directly here instead. Without this,
      # the Flutter UI has no generated bridge to call into the Rust core and
      # renders an empty window (exactly what happened before this rewrite).
      # Must run after Flutter is installed: the codegen tool shells out to
      # `flutter --version` itself while producing the Dart-side output.
      - name: Generate Flutter-Rust bridge
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION"
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Install Rust toolchain (pinned, for the RustDesk build)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      # RustDesk ships Flutter Windows desktop with a custom-patched engine
      # build (not the stock Flutter engine) — required, not optional, for
      # their Windows-specific window/rendering behavior.
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $enginePath = "C:/hostedtoolcache/windows/flutter/stable-$($env:FLUTTER_VERSION)-x64/bin/cache/artifacts/engine/windows-x64-release/"
          New-Item -ItemType Directory -Force -Path $enginePath | Out-Null
          Copy-Item -Path windows-x64-release\* -Destination $enginePath -Recurse -Force

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          & "$env:VCPKG_ROOT\vcpkg" install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT\installed"

      # This is a defense-in-depth fallback only. The mechanism RustDesk's
      # Flutter client actually relies on at every startup is the filename
      # token embedded by the "Package as portable single exe" step below
      # (get_license_from_exe_name() in rustdesk/src/platform/windows.rs) —
      # that's what makes a freshly downloaded/copied exe self-configure on
      # a machine with no prior RustDesk config. These compiled-in constants
      # are only ever consulted as a last resort, and only if the local
      # machine has no persisted RustDesk config from an earlier run/install
      # (verified against the real rustdesk/hbb_common source — the real
      # names are RENDEZVOUS_SERVERS: &[&str] and RS_PUB_KEY: &str, not the
      # DEFAULT_-prefixed names an older guide used; there is no compile-time
      # default constant for the relay server at all).
      - name: Set ID/Key from Secrets into hbb_common config.rs (fallback only)
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          if (-not $env:RENDEZVOUS_SERVER) { $env:RENDEZVOUS_SERVER = "$env:DEFAULT_RENDEZVOUS_SERVER" }
          if (-not $env:RS_PUB_KEY) { $env:RS_PUB_KEY = "$env:DEFAULT_RS_PUB_KEY" }
          echo "Using RENDEZVOUS_SERVER=$env:RENDEZVOUS_SERVER"
          echo "Using RS_PUB_KEY=(hidden)"
          $configFile = Join-Path (Get-Location) 'libs\hbb_common\src\config.rs'
          if (-not (Test-Path $configFile)) {
            Write-Error "hbb_common config.rs not found at $configFile - submodule checked out?"; exit 1
          }
          $content = Get-Content $configFile
          $content = $content -replace '(?m)^(\s*pub\s+const\s+RENDEZVOUS_SERVERS\s*:\s*&\[&str\]\s*=\s*)&\[[^\]]*\]', "`$1&[`"$env:RENDEZVOUS_SERVER`"]"
          $content = $content -replace '(?m)^(\s*pub\s+const\s+RS_PUB_KEY\s*:\s*&str\s*=\s*)"[^"]*"', "`$1`"$env:RS_PUB_KEY`""
          Set-Content $configFile -Value $content -Encoding UTF8
          $verify = Get-Content $configFile -Raw
          if ($verify -notmatch [regex]::Escape("RENDEZVOUS_SERVERS: &[&str] = &[`"$env:RENDEZVOUS_SERVER`"]")) {
            Write-Error "RENDEZVOUS_SERVERS patch did not take effect - const name/format in upstream config.rs may have changed again."; exit 1
          }
          if ($verify -notmatch [regex]::Escape("RS_PUB_KEY: &str = `"$env:RS_PUB_KEY`"")) {
            Write-Error "RS_PUB_KEY patch did not take effect - const name/format in upstream config.rs may have changed again."; exit 1
          }

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          Move-Item -Force .\flutter\build\windows\x64\runner\Release .\rustdesk

      # RustDesk's own "portable packer" (libs/portable) is the real mechanism
      # behind their official single-file portable .exe — same tool the actual
      # RustDesk releases use, not a home-grown IExpress/7-Zip substitute.
      #
      # The compiled-in config.rs constants patched above are only a last
      # resort fallback (and are overridden by ANY pre-existing local RustDesk
      # config on the machine, e.g. from earlier manual testing). The
      # mechanism that reliably self-configures on a genuinely fresh machine
      # is CUSTOM_CLIENT_TOKEN embedded right in the exe's filename: RustDesk
      # reads its own filename on every startup (get_license_from_exe_name()
      # -> get_custom_server_from_string() in rustdesk/src/custom_server.rs +
      # src/platform/windows.rs) looking for a "--<token>" segment, where
      # <token> is a reversed, unpadded base64url encoding of the JSON
      # {"key","host","api","relay"} — exactly what CUSTOM_CLIENT_TOKEN
      # already is (built server-side in RustDeskConfigService/RustDeskBuildService).
      # A plain "-<safe-name>-" segment before the "--" is only cosmetic and
      # is tried first, fails harmlessly (not valid base64/JSON), and RustDesk
      # falls through to the real token right after it.
      - name: Package as portable single exe
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          CUSTOM_CLIENT_TOKEN: ${{ secrets.CUSTOM_CLIENT_TOKEN }}
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          rdHost="${RENDEZVOUS_SERVER:-$DEFAULT_RENDEZVOUS_SERVER}"
          safeHost=$(echo "$rdHost" | sed -E 's/[^a-zA-Z0-9.-]/-/g')
          if [ -z "$CUSTOM_CLIENT_TOKEN" ]; then
            echo "::error::CUSTOM_CLIENT_TOKEN secret is empty - MSPoc-Einstellungen (ID-Server/Key) unvollstaendig?"
            exit 1
          fi
          finalName="rustdesk-$safeHost--$CUSTOM_CLIENT_TOKEN.exe"
          mv ./target/release/rustdesk-portable-packer.exe "./$finalName"
          echo "FINAL_EXE_NAME=$finalName" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: ${{ env.FINAL_EXE_NAME }}

      - name: Show binary size
        run: |
          Get-ChildItem $env:FINAL_EXE_NAME | Select-Object Name,Length
